[project]
name = "kura-cli"
version = "0.2.0"
description = "Fetch and publish a package's files in a kura store, on main or on a tag."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
kura = "kura_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kura_cli"]
